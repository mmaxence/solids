<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{url}}">
<link rel="icon" href="{{root}}favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{root}}og/apple-touch-icon.png">
<meta name="theme-color" content="#0a0a0c" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f4f7" media="(prefers-color-scheme: light)">
<meta property="og:type" content="website">
<meta property="og:site_name" content="solids">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{url}}">
<meta property="og:image" content="{{image}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{imageAlt}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{title}}">
<meta name="twitter:description" content="{{description}}">
<meta name="twitter:image" content="{{image}}">
<meta name="twitter:image:alt" content="{{imageAlt}}">
<link rel="stylesheet" href="{{root}}styles.css">
<script>try{var t=localStorage.getItem('sd-theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
<script type="module" src="{{root}}solids.js"></script>
<script type="module" src="{{root}}site.js"></script>
</head>
<body>
<a class="skip" href="#{{skip}}">Skip to content</a>
<header class="top">
  <a class="brand" href="{{root}}index.html"><sd-orb size="22px" color="#9bd1ff" glow="0.4"></sd-orb><span>solids</span></a>
  <nav class="top-links" aria-label="Site">
    <a href="https://github.com/mmaxence/solids">GitHub</a>
    <button type="button" class="theme" aria-label="Switch theme">Theme</button>
  </nav>
</header>
{{hero}}
<div class="frame">
  <nav class="side" aria-label="Library">{{nav}}</nav>
  <main id="main" class="main">{{main}}</main>
</div>
<footer class="foot">
  <span>solids is MIT licensed.</span>
  <span>Built by <a href="https://mmaxence.me">Maxence Mauduit</a>. Also exploring <a href="https://mmaxence.github.io/materia/">Materia: living typography</a>.</span>
</footer>
</body>
</html>
