<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="description" content="{{description}}">
<meta name="robots" content="index,follow,max-image-preview:large">

<meta name="twitter:image" content="{{image}}">
<meta name="twitter:image:alt" content="{{imageAlt}}">
<link rel="stylesheet" href="{{root}}styles.css?v=family-20261109">
<script>try{var t=localStorage.getItem('sd-theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
<script type="module" src="{{root}}solids.js"></script>
<script type="module" src="{{root}}site.js"></script>
<!-- Dedicated Solids counter; generated paths exclude queries and playground inputs. -->
<script data-goatcounter="https://solids.goatcounter.com/count"
  data-goatcounter-settings='{"path":"/{{analyticsPath}}","referrer":"","no_events":true}'
  async src="https://gc.zgo.at/count.js" referrerpolicy="no-referrer"></script>
<script type="module" src="{{root}}product-nav.js?v=direct-links"></script><script type="module" src="{{root}}brand/brand.js"></script><link rel="stylesheet" href="{{root}}brand/brand.css"><link rel="stylesheet" href="{{root}}family-nav.css?v=split-nav"></head>

<a class="skip" href="#{{skip}}">Skip to content</a>
<header class="top family-header"><div class="nav-left"><a class="brand" href="{{root}}index.html" aria-label="Solids home"><b class="brand-word">solids</b></a><nav class="local-nav" aria-label="On this site"><a href="{{root}}index.html#hero">Playground</a><a href="{{root}}index.html#main">Library</a></nav></div><nav class="service-nav" aria-label="Products and source"><product-navigation current="solids"></product-navigation><a href="https://github.com/mmaxence/solids">GitHub</a><button type="button" class="theme" aria-label="Switch theme">Theme</button></nav></header>
{{hero}}
<div class="frame">
  <nav class="side" aria-label="Library">{{nav}}</nav>
  <main id="main" class="main">{{main}}</main>
</div>
<footer class="foot"><span>Solids · MIT open source</span><nav aria-label="Projects by Maxence"><a href="https://mmaxence.github.io/materia/">Materia</a><a href="https://mmaxence.github.io/prisma/">Prisma</a><a class="creator" href="https://mmaxence.me/">Meet Maxence</a></nav><a href="{{root}}llms.txt">Agent docs</a></footer>
</body>
</html>
